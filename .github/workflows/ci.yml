name: CI
on:
  push:
    branches: [main]
  pull_request:

# least-privilege GITHUB_TOKEN at the workflow level (OpenSSF Token-Permissions): CI only reads the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # third-party actions pinned to a full commit SHA (OpenSSF Pinned-Dependencies) — a moved tag cannot alter CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The recap-per-issue gate reads the closed-issue set from each round's OWN commits. A shallow
          # clone leaves that domain nearly EMPTY, so the rule passes vacuously and only its pin notices.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm install
      - name: protocol conformance + language-neutral arc contract (spec == package == vectors)
        run: npm test
      - name: reference checker TCB — byte-vector corpus + coverage manifest (regenerate == committed) + JS asserts + robustness fuzz
        run: npm run test:byte-vectors && npm run test:reference-checker && npm run test:reference-checker-fuzz
      - name: bounded-exhaustive model check — per-rule induction step (total/deterministic/contract-gated) + exhaustive single-mutation soundness
        run: npm run test:bmc
      - name: temporal model check — key-log state machine vs an independent abstract model + exhaustive non-active-signer soundness over every reachable interleaving
        run: npm run test:temporal-bmc
      # #34 — PORTING.md told a stranger to call "the Go binary" and there are zero .go files here. A second
      # independent implementation is the anti-monoculture argument; claiming one that does not exist buys the
      # credibility it cannot back, and no code-vs-code gate can see prose.
      # R-174 recorded that recap-compose.mjs was invoked by NOTHING — its --check, the refusal that makes the
      # report shape binding, ran only when an author typed it. This runs the generator and observes BOTH
      # directions of that refusal: it must reject a skeleton and accept a written report.
      - name: the report generator holds its own contract (round 174, wired here)
        run: npm run test:recap-selfcheck
      - name: a document may not claim an artifact this tree does not contain
        run: npm run test:promised
      - name: a record of a past defect carries its closing (an honest failure log reads as open holes without one)
        run: npm run test:record-closure
      - name: remedy guard (F.5.1d — no verdict prescribes an input the call already supplied)
        run: npm run test:remedy-guard
      - name: protocol-name gate (an artifact wearing the name MUST verify under it)
        run: npm run test:protocol-name
      - name: model <-> code guard (every formal theorem is a real conformance check)
        run: npm run test:model
      - name: model-lockstep guard (every enforcement realization cites an ADVERSARIAL-closure check, not just the happy path)
        run: npm run test:model-lockstep
      - name: model-domain totality (every model SECTION is bound by an executed check, a registry record, or an explicit closed-set reason)
        run: npm run test:model-domain
      - name: readme block (ten copies of one normative paragraph, and nothing watched them)
        run: npm run test:readme-block
      - name: one issue, one diary (a round closing two cards leaves the second unaccounted)
        run: npm run test:recap-per-issue
      - name: browser portability (RUN the mapped core without Node globals — a bundle that builds proves less)
        run: npm run test:browser
      - name: vacuity battery (break the verifier on purpose — a registered check that still passes proves nothing)
        run: npm run test:vacuity
      - name: retired mechanisms (an abandoned path cannot walk back into the spec or the model)
        run: npm run test:retired
      - name: ust_id tier containment (§8 ABNF has no separator; a coarser frame is a literal prefix — the IANA-registered scheme, UST-gqj)
        run: npm run test:ustid
      - name: language-neutral vectors in sync with the reference impl (regenerate == committed)
        run: npm run test:vectors
      - name: package enumeration (packages/ == README table == map panel; both directions, UST-l63)
        run: npm run test:packages
      - name: The repository root is enumerated, not accumulated
        run: npm run test:root
      - name: spec <-> code registry sync (canonical string sets — spec == REGISTRY == code)
        run: npm run test:spec-sync
      - name: capability parity (every surface's stance matches the spec's capability set — no silent lag, UST-3dj class)
        run: npm run test:parity
      - name: display safety (#73 — human renderers neutralize the whole \p{Cf} class; the two surfaces cannot drift)
        run: npm run test:display
      - name: docs verifier parity (clean-room web verifier agrees with the reference — no silent verdict drift, UST-ybn)
        run: npm run test:docs-parity
      - name: CLI ceremony regression (9th-audit — the seven points cannot regress)
        run: npm run test:cli
      - name: Every command the tool prints is one the tool can run
        run: npm run test:printed
      - name: Every command the tool dispatches is one the tool can ENTER (a body that cannot run is not a green build)
        run: npm run test:reachable
      - name: A typed consumer can build and verify with the declarations we ship (the only gate that sees an optional silently demoted)
        run: npm run test:probe
      - name: the diary view matches what was signed (diarium.md is GENERATED from the store, never hand-edited)
        run: npm run test:diary
      - name: diarium store discipline (chain-derived order, refusal to extend damage, the cap, one closure one entry)
        run: npm run test:diarium
      - name: round recaps are a VERBATIM view of a sealed entry, land in the ISSUE and not the changelog, and every live round is decided
        run: npm run test:recap
      - name: key_op contract (what a surface tells a producer to build == what the verifier admits)
        run: npm run test:keyop
      - name: assurance map (every CI step declares what decides its dispute, and the code must support the claim)
        run: npm run test:assurance-map
      - name: ust-light is a valid UST subset (byte-identical to the reference impl, both directions)
        run: npm run test:light
      # #144 — the browser build was loaded by NO gate until 2026-08-09, and it shipped calling a VALID signature
      # INVALID. This step executes it and asserts a VERDICT over a real document, not canon/keyId parity: the
      # pure parts agreed all along, which is exactly why their agreement stayed green over an accusation.
      - name: the browser build refuses, and a refusal never becomes a verdict (#144)
        run: npm run test:browser-build
      - name: light README panels are DERIVED from the dark originals, never hand-edited
        run: npm run test:artwork
      - name: security regression (external-audit P0/P1 reproductions must stay closed — epic UST-1o6)
        run: npm run test:security
      - name: SSRF guards (core + MCP)
        run: npm run test:ssrf
      - name: drift-guards (meta — every from-code gate is fail-closed; injects a fake drift, asserts the gate rejects it, restores)
        run: npm run test:drift-guards
      - name: verdict vocabulary (no surface names a verdict the reference cannot return)
        run: npm run test:vocabulary
      - name: primitive parity (every shared entry point; the entry-point SET is pinned)
        run: npm run test:primitive-parity
      - name: stream parity (completeness verdict identical in both verifiers; no-omission only via the signed grid)
        run: npm run test:stream-parity
      - name: cadence parity (clean-room browser resolver == reference on every vector)
        run: npm run test:cadence-parity
      - name: cadence discovery (a declared grid is reachable; unreadable ≠ undeclared)
        run: npm run test:cadence
      - name: Discovery serving — produced artifacts must have a serving path on both roads
        run: npm run test:serving
      - name: Stream consumption — flag values are not frames; served logs are readable
        run: npm run test:consumption
      - name: Report shape — named floor vs absence; no invented vocabulary; no option the reference lacks
        run: npm run test:report-shape
      - name: inclusion connector (anchor inclusion is delegable; the bundled tree is one connector; the seam is total)
        run: npm run test:inclusion
      - name: module-seam totality (S1 — a NOT-OURS module return/throw is a structured verdict, never a host throw; invocation roster pinned from source)
        run: npm run test:module-seam
      - name: verdict attribution (every VALID verdict names its vocabulary; the digest moves with the rules, not with the file)
        run: npm run test:attribution
      - name: rule-lockstep (the §14 decision-relation is FROZEN — case labels == RULE_CONTRACTS keys == 15, both directions)
        run: npm run test:rule-lockstep
      - name: the substrate path carries no third-party code (REV 65 — a removal stays removed only if gated)
        run: npm run test:ots-codec
      - name: connector receipts (OTS + Rekor)
        # Zero dependency since REV 65: the `.ots` codec is ours, so there is no optional peer to install and
        # no step ordering to get right. The suite enumerates the package test files rather than naming them —
        # a named list is how `ots-codec.test.mjs` would have shipped unrun.
        run: npm run test:connectors
      - name: web-signer cross-verification
        run: npm run test:web-signer
      - name: MCP live stdio transport (CWD-independent)
        run: npm run test:mcp-live
      - name: dependency audit — no critical advisories in the SHIPPED (production) tree (P1-08)
        run: npm run test:audit
      - name: package contents (what ships must be able to LOAD, not merely to match)
        run: npm run test:package-contents
      - name: audit-claims gate (every number in the audit invitation is one this tree produces)
        run: node tools/audit-claims-gate.mjs --write && git diff --exit-code -- docs/AUDIT.md && node tools/audit-claims-gate.mjs
      - name: worked examples (an illustration declares what it is, and one that claims to be a document verifies)
        run: node tools/worked-example-gate.mjs
      - name: consumer probe (a typed consumer can build, verify and judge with the declarations we ship)
        run: node tools/consumer-probe-gate.mjs
      - name: dependency floors (a package declares the sibling version this tree actually tested against)
        run: node tools/dependency-floor-gate.mjs --write && git diff --exit-code -- '**/package.json' && node tools/dependency-floor-gate.mjs
      - name: pending bindings (a deferral names a tracker that is still OPEN, and only in the resolvable form)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the gate FAILS CLOSED on an unread tracker; unauthenticated is 60 req/h and would flake
        run: node tools/pending-binding-gate.mjs --write && git diff --exit-code -- tools/tracker-state.json && node tools/pending-binding-gate.mjs
      - name: root inventory (every top-level file AND directory is declared, not accumulated)
        run: node tools/root-inventory-gate.mjs
      - name: operator layer round-trip (@ust-protocol/operator PRODUCES exactly what the base VERIFIES)
        run: node packages/ust-operator/conformance.mjs
      - name: types integrity (every shipped .d.ts COMPILES and declares exactly what its module exports)
        run: node tools/types-integrity-gate.mjs
      - name: npm-drift gate (a published version is immutable)
        run: node tools/npm-drift-check.mjs
      - name: CHANGELOG rev-ladder gate (a checker rev bump records itself)
        run: npm run test:changelog
      - name: Ladder completeness — every round decides all five layers (reference or reasoned exclusion)
        run: npm run test:ladder
      - name: Ceremony self-checks assert what the ceremony preserves, never a world property
        run: npm run test:ceremony
      - name: The air-gapped ceremony half returns before any network reach, in the command and its callees
        run: npm run test:offline
      - name: unbounded index (an external counter has no ceiling we may assume)
        run: npm run test:unbounded-index
      - name: version truth (a version traces to a round; a capability gap may not widen)
        run: npm run test:version-truth
      - name: types parity (a declaration may not describe a source that no longer exists)
        run: npm run test:types-parity
      - name: checkpoint qualified (the word names two chains and may not stand alone)
        run: npm run test:ambiguous-terms
      - name: Every field the genesis builder can place is reachable from the ceremony
        run: npm run test:genesis-surface
      - name: A deploy is constructed from the complete discovery set or not at all
        run: npm run test:deploy
      - name: A constructed artifact is declared as such and extends its prior, never replaces it
        run: npm run test:artifact-origin
