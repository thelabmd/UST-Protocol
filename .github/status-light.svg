<title id="st-t">UST 1.0.0-rc.40 — release candidate status</title>
<desc id="st-d">UST status: 1.0.0-rc.40 — a release candidate, not a final 1.0. Verify machine-readable state without trusting whoever handed it to you. Multiple external AI reviews incorporated structurally; an independent human cryptographic audit is pending; suitable for evaluation and integration testing. The wire format ust:&quot;1.0&quot; is stable across all release candidates; pin exact versions.</desc>
